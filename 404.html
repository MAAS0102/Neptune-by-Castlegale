<!doctype html>
<!-- ========================================================================
     404.html: the page shown when someone types or follows an address that
     does not exist on the site. GitHub Pages serves a file with exactly this
     name automatically, so nothing needs to link to it.

     Because it can be shown for an address at any depth (for example
     /anything/at/all), every link and file below starts with a slash. A
     leading "/" means "from the very top of the website", which works the
     same wherever the visitor happens to be. The other pages use plain file
     names instead, since they always sit in the top folder.
     ======================================================================== -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Neptune by Castlegale</title>
  <!-- "noindex" asks search engines not to list this page. -->
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <!-- The "centered" class centres its text; "quote" gives the large
         heading style used elsewhere. -->
    <section class="centered notfound">
      <a href="/" aria-label="Neptune by Castlegale home"><img class="logo notfound-logo" src="/images/logo.png" alt="Neptune by Castlegale logo"></a>
      <h1 class="notfound-title">404</h1>
      <h2>Page not found</h2>
      <p>The page you were looking for has drifted away. Let us take you back to shore.</p>
      <div class="btn-row">
        <a class="btn btn-outline" href="/">Back to home</a>
        <a class="btn btn-outline" href="/contact.html">Contact us</a>
      </div>
    </section>
  </main>
</body>
</html>
